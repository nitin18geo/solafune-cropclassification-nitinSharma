# Central configuration for the crop classification project.
# All scripts read paths and settings from here; nothing is hard-coded.

paths:
  data_dir: data
  s2_dir: data/DATA_S2
  labels_dir: data/ANNOTATIONS
  metadata: data/metadata.geojson
  outputs_dir: outputs
  figures_dir: outputs/figures
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  splits_dir: outputs/splits
  models_dir: models
  processed_dir: data/processed

seed: 42

# Basemap for the AOI map (contextily provider name, or "none").
# OpenStreetMap.Mapnik blocks automated requests, and CartoDB now needs an API key, so Esri is used.
aoi_basemap: Esri.WorldTopoMap

bands: [B2, B3, B4, B5, B6, B7, B8, B8A, B11, B12]

classes:
  0: Background
  1: Meadow
  2: Soft winter wheat
  3: Corn
  4: Winter barley
  5: Winter rapeseed
  6: Spring barley
  7: Sunflower
  8: Grapevine
  9: Beet
  10: Winter triticale
  11: Winter durum wheat
  12: Fruits, vegetables, flowers
  13: Potatoes
  14: Leguminous fodder
  15: Soybeans
  16: Orchard
  17: Mixed cereal
  18: Sorghum
  19: Void label

void_label: 19

# Classes ignored in training and evaluation (like the void label).
# Each occurs in at most one patch, so it cannot appear in both the training
# and test splits without spatial leakage (Beet does not occur at all).
excluded_classes: [8, 9, 13, 16]   # Grapevine, Beet, Potatoes, Orchard

# Train / validation / test split by PASTIS fold (folds are spatially separated,
# so neighbouring fields never end up on both sides of the split).
split:
  train_folds: [1, 2, 3]
  val_folds: [4]
  test_folds: [5]

# Preprocessing and feature engineering
preprocessing:
  reflectance_max: 10000          # S2 L2A scale factor; values clipped to [0, 10000]
  drop_cloudy_dates: true         # drop dates that are cloudy across the whole AOI
  cloud_blue_threshold: 0.2       # B2 reflectance above this = likely cloud/haze
  cloud_date_max_frac: 0.5        # drop a date if more than this share of pixels is bright
  indices: [NDVI, NDWI, NDMI, NDRE]

# Pixel sampling for building the training and validation tables
sampling:
  max_pixels_per_class_per_patch: 150

# Model training
training:
  models: [random_forest, lightgbm]   # which models train.py fits
  class_weighting: sqrt_inverse       # none | balanced | sqrt_inverse
 
random_forest:
  n_estimators: 200
  max_features: sqrt
  min_samples_leaf: 5
  n_jobs: -1
 
lightgbm:
  n_estimators: 1000                  # upper limit; early stopping picks the best
  learning_rate: 0.1
  num_leaves: 63
  min_child_samples: 20
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.5
  reg_lambda: 1.0
  early_stopping_rounds: 50
  n_jobs: -1
 